services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Backend
      args:
        APP_VERSION: ${APP_VERSION:-development}
    image: pocketadvisor-api:${APP_VERSION:-development}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultHost: db
      ConnectionStrings__DefaultPort: "5432"
      ConnectionStrings__DefaultDatabase: ${POSTGRES_DB:?POSTGRES_DB is required}
      SecureStore__StorePath: /run/secrets/secure_store
      SecureStore__KeyFilePath: /run/secrets/secure_key
    secrets:
      - secure_store
      - secure_key
    ports:
      - "127.0.0.1:${API_PORT:-5078}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:

secrets:
  secure_store:
    file: ./Backend/PocketAdvisor.WebApplication/secrets.bin
  secure_key:
    file: ./Backend/PocketAdvisor.WebApplication/secrets.key
